server.port=8080

# In-memory H2 database - resets every time you restart the app.
spring.datasource.url=jdbc:h2:mem:laundrydb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true

# ---------------------------------------------------------------------------
# WhatsApp Cloud API
# Set these environment variables before starting the backend.
#
# WHATSAPP_ENABLED=true
# WHATSAPP_ACCESS_TOKEN=<Meta permanent/system-user access token>
# WHATSAPP_PHONE_NUMBER_ID=<WhatsApp Business phone number ID>
#
# GRAPH_API_VERSION can be changed without rebuilding the application.
# ---------------------------------------------------------------------------
whatsapp.enabled=${WHATSAPP_ENABLED:false}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.graph-api-version=${WHATSAPP_GRAPH_API_VERSION:v25.0}
